<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vortex Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="logo">VORTEX</div>
    <nav>
      <button class="nav-item active" data-view="overview">Overview</button>
      <button class="nav-item" data-view="security">Security</button>
      <button class="nav-item" data-view="moderation">Moderation</button>
      <button class="nav-item" data-view="tickets">Tickets</button>
      <button class="nav-item" data-view="campaigns">Campaigns</button>
      <button class="nav-item" data-view="giveaways">Giveaways</button>
      <button class="nav-item" data-view="transactions">Transactions</button>
      <button id="logout">Logout</button>
    </nav>
  </aside>
  <main class="content">
    <header class="page-header">
      <div><p class="eyebrow">COMMUNITY OPERATIONS</p><h1 id="pageTitle">Command Center</h1></div>
      <span id="botStatus" class="status">Checking</span>
    </header>
    <section id="overviewView">
      <div class="cards">
        <article><label>Verified members</label><strong id="verified">—</strong></article>
        <article><label>Moderation cases</label><strong id="moderationCount">—</strong></article>
        <article><label>Open tickets</label><strong id="ticketsCount">—</strong></article>
        <article><label>Security events</label><strong id="securityCount">—</strong></article>
      </div>
      <section class="panel">
        <h2>Recent security activity</h2>
        <div id="activity" class="activity" aria-live="polite"><p>Loading dashboard…</p></div>
      </section>
    </section>
    <section id="recordsView" class="panel" hidden>
      <p class="eyebrow" id="sectionDescription"></p>
      <div id="records" class="records" aria-live="polite"></div>
    </section>
  </main>
  <script src="/dashboard.js"></script>
</body>
</html>
